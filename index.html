<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inglés Técnico II — Study App v2</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f8ef7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
  --accent:#4f8ef7; --green:#22c55e; --red:#ef4444; --yellow:#f59e0b;
  --purple:#7c3aed; --orange:#f97316;
  --text:#e2e8f0; --text2:#8892a4; --text3:#4a5568;
  --mono:'JetBrains Mono','Fira Code','Courier New',monospace;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
  --r:10px; --rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh}
#app{display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
header .sub{font-size:12px;color:var(--text2)}
#bc{font-size:11px;color:var(--text3);margin-left:auto}

main{flex:1;padding:28px 20px;max-width:900px;margin:0 auto;width:100%}

/* BANNER */
.banner{background:#2d1f00;border:1px solid var(--yellow);border-radius:var(--rs);padding:10px 16px;font-size:12px;color:var(--yellow);display:flex;align-items:center;gap:10px;margin-bottom:20px}
.banner strong{color:#fde68a}
/* SRS THEORY */
.srs-theory{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.srs-theory h2{font-size:15px;font-weight:700;color:var(--green);margin-bottom:12px}
.srs-theory h3{font-size:12px;font-weight:700;color:var(--yellow);margin:12px 0 6px}
.srs-theory p{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:8px}
.srs-theory p strong{color:var(--text)}
.srs-theory .formula{background:var(--surface2);border-left:3px solid var(--green);border-radius:var(--rs);padding:8px 12px;font-family:var(--mono);font-size:11px;color:var(--green);margin:6px 0}
.srs-theory .warn{background:#2d1f00;border:1px solid var(--yellow);border-radius:var(--rs);padding:8px 12px;font-size:11px;color:var(--yellow);margin:6px 0;white-space:pre-line}
.srs-theory-title{font-size:17px;font-weight:800;color:var(--green);margin-bottom:14px;line-height:1.4}
.srs-theory .kw-table td.ex-ok{color:var(--green);font-weight:400}
.srs-theory .kw-table td.ex-bad{color:var(--red)}
.srs-theory .table-wrap .kw-table{min-width:0}
.srs-theory-done{margin-top:16px;background:var(--green);color:#000;border:none;padding:10px 20px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:700;width:100%}
/* HOME */
.home-title{font-size:26px;font-weight:800;margin-bottom:4px}
.home-sub{color:var(--text2);font-size:13px;margin-bottom:20px}

/* SECTION HEADER */
.sec-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:28px 0 10px}

/* TOPIC GRID */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:8px}
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:border-color .15s,transform .1s;display:flex;flex-direction:column;gap:8px}
.topic-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.topic-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tag-grammar{color:var(--accent)}
.tag-srs{color:var(--green)}
.tag-mixed{color:var(--yellow)}
.tag-error{color:var(--red)}
.topic-name{font-size:16px;font-weight:700}
.topic-desc{font-size:12px;color:var(--text2);line-height:1.5}
.prog-bg{background:var(--border);border-radius:99px;height:3px;margin-top:4px}
.prog-fill{border-radius:99px;height:3px;transition:width .4s}
.fill-accent{background:var(--accent)}
.fill-green{background:var(--green)}
.fill-yellow{background:var(--yellow)}
.prog-lbl{font-size:10px;color:var(--text3);margin-top:3px}

/* BACK + TABS */
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:var(--rs);cursor:pointer;font-size:12px;margin-bottom:20px;transition:border-color .15s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.mode-tabs{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.mode-tab{flex:1;padding:10px;background:var(--surface);border:none;color:var(--text2);cursor:pointer;font-size:12px;font-weight:600;transition:background .15s,color .15s}
.mode-tab.active{background:var(--accent);color:#fff}
.mode-tab:disabled{opacity:.4;cursor:not-allowed}

/* THEORY */
.theory-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.theory-block h2{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--accent)}
.theory-block h3{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--yellow)}
.theory-block p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:8px}
.theory-block p strong{color:var(--text)}
.formula{background:var(--surface2);border-left:3px solid var(--accent);border-radius:var(--rs);padding:10px 14px;font-family:var(--mono);font-size:12px;color:var(--accent);margin:8px 0}
.ex-box{background:var(--surface2);border-radius:var(--rs);padding:8px 12px;font-size:12px;margin:4px 0}
.ex-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.ex-ok{color:var(--green);font-weight:600}
.ex-bad{color:var(--red)}
.kw-table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.kw-table th{background:var(--surface2);color:var(--text2);padding:7px 10px;text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.kw-table td{padding:7px 10px;border-top:1px solid var(--border);color:var(--text2)}
.kw-table td:first-child{color:var(--accent);font-weight:600}
.kw-table .kw{color:var(--yellow);font-family:var(--mono);font-size:11px}
.warn{background:#2d1f00;border:1px solid var(--yellow);border-radius:var(--rs);padding:10px 14px;font-size:12px;color:var(--yellow);margin:8px 0;white-space:pre-line}
.theory-done{margin-top:16px;background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:700;width:100%}
.theory-done:hover{opacity:.85}

/* VOCAB CARDS */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:6px}
.vc{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px;cursor:pointer;transition:border-color .15s}
.vc:hover{border-color:var(--accent)}
.vc-en{font-size:14px;font-weight:700}
.vc-es,.vc-ex{display:none}
.vc-es{font-size:12px;color:var(--green);margin-top:3px}
.vc-ex{font-size:10px;color:var(--text3);margin-top:5px;font-style:italic}
.vc-tap{font-size:9px;color:var(--text3);margin-top:6px}
.vc.flipped .vc-es,.vc.flipped .vc-ex{display:block}

/* QUIZ */
.quiz-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.quiz-ctr{font-size:12px;color:var(--text2)}
.quiz-pill{background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--accent)}
.quiz-q{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:12px}
.quiz-qtext{font-size:14px;font-weight:600;line-height:1.6;margin-bottom:4px;white-space:pre-wrap}
.quiz-hint{font-size:11px;color:var(--text3);margin-bottom:14px;font-style:italic}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;cursor:pointer;font-size:13px;text-align:left;color:var(--text);transition:border-color .1s}
.quiz-opt:hover:not(:disabled){border-color:var(--accent)}
.quiz-opt.correct{border-color:var(--green);background:#052e16;color:var(--green)}
.quiz-opt.wrong{border-color:var(--red);background:#2d0a0a;color:var(--red)}
.quiz-opt:disabled{cursor:default}
.quiz-fb{border-radius:var(--rs);padding:10px 14px;font-size:12px;line-height:1.6;margin-top:8px}
.quiz-fb.ok{background:#052e16;border:1px solid var(--green);color:#86efac}
.quiz-fb.ko{background:#2d0a0a;border:1px solid var(--red);color:#fca5a5}
.quiz-next{margin-top:12px;background:var(--accent);color:#fff;border:none;padding:9px 20px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:700}

/* PRODUCE */
.produce-q{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:12px}
.produce-prompt{font-size:14px;font-weight:600;line-height:1.6;margin-bottom:12px;white-space:pre-wrap}
.produce-hint{font-size:11px;color:var(--text3);margin-bottom:12px;font-style:italic}
.produce-inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:13px;font-family:var(--body);resize:vertical;min-height:56px;transition:border-color .15s}
.produce-inp:focus{outline:none;border-color:var(--accent)}
.produce-acts{display:flex;gap:8px;margin-top:10px}
.btn-reveal{background:var(--surface2);color:var(--text2);border:1px solid var(--border);padding:9px 18px;border-radius:var(--rs);cursor:pointer;font-size:13px}
.prod-ans{margin-top:10px;background:var(--surface2);border-radius:var(--rs);padding:10px 14px;font-size:12px}
.prod-ans-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.prod-ans-text{color:var(--green);font-weight:600}
.prod-ans-why{color:var(--text2);margin-top:5px;font-size:11px;line-height:1.5}
.prod-self{display:flex;gap:8px;margin-top:10px}
.btn-ok{flex:1;background:#052e16;border:1px solid var(--green);color:var(--green);padding:8px;border-radius:var(--rs);cursor:pointer;font-weight:700;font-size:12px}
.btn-ko{flex:1;background:#2d0a0a;border:1px solid var(--red);color:var(--red);padding:8px;border-radius:var(--rs);cursor:pointer;font-weight:700;font-size:12px}

/* SRS MODE */
.srs-interview{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;font-size:13px;line-height:1.8;color:var(--text2);max-height:280px;overflow-y:auto}
.srs-interview strong{color:var(--accent)}
.srs-interview .client{color:var(--green)}
.srs-steps{display:flex;flex-direction:column;gap:12px}
.srs-step{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.srs-step-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--yellow)}
.srs-step-desc{font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.5}
.srs-inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:12px;font-family:var(--body);resize:vertical;min-height:80px;transition:border-color .15s}
.srs-inp:focus{outline:none;border-color:var(--green)}
.srs-check-btn{margin-top:8px;background:var(--green);color:#000;border:none;padding:8px 18px;border-radius:var(--rs);cursor:pointer;font-size:12px;font-weight:700}
.srs-fb{margin-top:10px;background:var(--surface2);border-radius:var(--rs);padding:10px 14px;font-size:12px;line-height:1.6}
.srs-fb h4{font-size:11px;font-weight:700;color:var(--green);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.srs-fb .model{color:var(--green);margin-bottom:4px}
.srs-fb .tip{color:var(--text2);font-style:italic}
.srs-nav{display:flex;gap:8px;margin-top:16px}
.srs-nav-btn{background:var(--accent);color:#fff;border:none;padding:9px 20px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:700}
.srs-nav-btn.sec{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

/* RESULTS */
.results{text-align:center;padding:36px 16px}
.results-score{font-size:60px;font-weight:900;color:var(--accent)}
.results-lbl{font-size:14px;color:var(--text2);margin-bottom:20px}
.results-msg{font-size:14px;margin-bottom:28px}
.results-btn{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:var(--rs);cursor:pointer;font-size:14px;font-weight:700;margin:0 4px}
.results-btn.sec{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

/* BLOQUEO "VER RESPUESTA" + CORRECCIÓN AUTOMÁTICA */
.btn-reveal:disabled,.srs-check-btn:disabled{opacity:.4;cursor:not-allowed}
.ans-lock{font-size:11px;color:var(--text3);margin-top:6px;font-style:italic}
.your-ans{margin-top:10px;background:var(--surface2);border-radius:var(--rs);padding:10px 14px;font-size:12px;color:var(--text2);white-space:pre-wrap;line-height:1.5;max-height:160px;overflow-y:auto}
.corr{margin-top:10px;border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;background:var(--surface)}
.corr-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.corr-score{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--accent)}
.corr-sec{margin-top:12px}
.corr-t{font-size:11px;font-weight:700;margin-bottom:6px;letter-spacing:.04em}
.corr-ok .corr-t{color:var(--green)}
.corr-ko .corr-t{color:var(--red)}
.corr-miss .corr-t{color:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid;font-family:var(--mono)}
.chip-ok{color:var(--green);border-color:var(--green);background:#052e16}
.chip-miss{color:var(--yellow);border-color:var(--yellow);background:#2d1f00}
.corr-item{font-size:12px;line-height:1.5;padding:6px 10px;border-radius:var(--rs);margin-top:4px}
.corr-ok .corr-item{background:#052e16;color:#86efac}
.corr-ko .corr-item{background:#2d0a0a;color:#fca5a5}
.corr-none{font-size:11px;color:var(--text3);font-style:italic}
.corr-note{font-size:10px;color:var(--text3);margin-top:12px;font-style:italic}

/* PASOS SRS con saltos de línea + líneas vacías en modelos */
.srs-step-desc{white-space:pre-line}
.srs-fb .model:empty{height:.8em}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-wrap .kw-table{min-width:460px}

/* ── MOBILE ─────────────────────────────────────────────────────── */
@media (max-width:768px){
  .produce-inp,.srs-inp{font-size:16px}
}
@media (max-width:600px){
  header{flex-wrap:wrap;padding:10px 14px;gap:4px 10px}
  #bc{margin-left:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:18px 14px}
  .home-title{font-size:22px}
  .topic-grid{grid-template-columns:1fr}
  .vocab-grid{grid-template-columns:repeat(2,1fr)}
  .theory-block,.srs-theory,.quiz-q,.produce-q,.srs-interview{padding:14px}
  .quiz-opt,.quiz-next,.btn-reveal,.btn-ok,.btn-ko,.srs-check-btn,.srs-nav-btn,.results-btn,.back-btn,.mode-tab,.theory-done,.srs-theory-done{min-height:44px}
  .quiz-next,.srs-check-btn,.srs-nav-btn{width:100%}
  .results-btn{margin:4px}
  /* 3+ tabs: ícono arriba, texto corto abajo */
  .mode-tab:first-child:nth-last-child(n+3),
  .mode-tab:first-child:nth-last-child(n+3)~.mode-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;font-size:11px}
  .mode-tab:first-child:nth-last-child(n+3) .tab-ico,
  .mode-tab:first-child:nth-last-child(n+3)~.mode-tab .tab-ico{font-size:16px}
}
@media (max-width:360px){
  .vocab-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Inglés Técnico II</h1>
    <span class="sub">Study App v2</span>
    <div id="bc"></div>
  </header>
  <main id="main"></main>
</div>
<script>
// ════════════════════════════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════════════════════════════

// ── SECCIÓN 1: GRAMÁTICA (Parcial 1) ────────────────────────────────
const GRAMMAR_TOPICS = [
  {
    id:'passive', tag:'grammar', tagLabel:'Gramática',
    name:'Passive Voice',
    desc:'Past Simple, Past Continuous y Present Perfect en voz pasiva.',
    theory:{sections:[
      {title:'¿Qué es la voz pasiva?',content:`En la voz <strong>activa</strong>, el sujeto hace la acción.<br>En la voz <strong>pasiva</strong>, el sujeto <em>recibe</em> la acción.<br><br>Usamos pasiva cuando la acción importa más que quien la hizo.`,
       examples:[{lbl:'Activa',text:'The developer fixed the bug.'},{lbl:'Pasiva',text:'The bug was fixed by the developer.'}]},
      {title:'Estructura general',formula:'Sujeto + TO BE (tiempo) + participio pasado (+ by + agente)'},
      {title:'Los 3 tiempos del examen',table:[
        {col1:'Past Simple Passive',col2:'was/were + p.p.',col3:'yesterday, last year, in 2018, before X'},
        {col1:'Past Continuous Passive',col2:'was/were being + p.p.',col3:'while, when (+ interrupción)'},
        {col1:'Present Perfect Passive',col2:'have/has been + p.p.',col3:'since, recently, in recent years'},
      ],headers:['Tiempo','Estructura','Palabras clave']},
      {title:'⚠️ was vs were',warn:'was → singular (the bug, the app, the system)\nwere → plural (the bugs, the apps, all modules)\n\nTruco: "it" → was / "they" → were'},
    ]},
    quiz:[
      {q:'The operating system _______ by a team of engineers in 2018.',hint:'"in 2018" = tiempo específico pasado.',opts:['was developed','has been developed','was being developed'],correct:0,why:'"in 2018" → Past Simple Passive: was + developed.'},
      {q:'While the new app _______, several bugs were discovered.',hint:'"While" = acción en progreso.',opts:['was developed','was being developed','has been developed'],correct:1,why:'"While" + otra acción pasada → Past Continuous Passive: was being + developed.'},
      {q:'Many updates _______ since the product was launched.',hint:'"since" conecta pasado con presente.',opts:['were released','were being released','have been released'],correct:2,why:'"since" → Present Perfect Passive: have been + released.'},
      {q:'The database _______ last year.',hint:'"last year" = tiempo específico.',opts:['was created','has been created','was being created'],correct:0,why:'"last year" → Past Simple Passive: was + created.'},
      {q:'A new tool _______ when the company changed its requirements.',hint:'"when [interrupción]" = acción en progreso.',opts:['was designed','has been designed','was being designed'],correct:2,why:'"when + interrupción" → Past Continuous Passive: was being + designed.'},
      {q:'Python _______ for many projects since its creation.',hint:'"since its creation" llega hasta hoy.',opts:['was used','was being used','has been used'],correct:2,why:'"since" → Present Perfect. Singular "Python" → has been + used.'},
    ],
    produce:[
      {prompt:'Convertí a pasiva:\n"The developer fixed the login issue."',hint:'Past Simple. ¿Cuál es el objeto?',answer:'The login issue was fixed by the developer.',why:'"login issue" singular → was + fixed (p.p. regular).'},
      {prompt:'Convertí a pasiva:\n"Developers have improved the user experience."',hint:'Present Perfect → Present Perfect Passive.',answer:'The user experience has been improved by developers.',why:'"user experience" singular → has been + improved.'},
      {prompt:'Completá:\n"The OS _______ (test) when a critical error interrupted the process."',hint:'"when [interrupción]" → ¿qué tiempo?',answer:'was being tested',why:'Past Continuous Passive. "OS" singular → was being + tested.'},
    ]
  },
  {
    id:'conditionals', tag:'grammar', tagLabel:'Gramática',
    name:'Zero & First Conditional',
    desc:'Verdades generales vs posibilidades futuras.',
    theory:{sections:[
      {title:'Zero Conditional — siempre verdad',formula:'If + present simple,  present simple',
       content:'Para cosas que <strong>siempre</strong> ocurren. Ley o regla técnica.',
       examples:[{lbl:'Ejemplo',text:'If a loop has no exit condition, it runs forever.'},{lbl:'Con "when"',text:'When data enters the system, it is stored in the database.'}]},
      {title:'First Conditional — posibilidad futura',formula:'If + present simple,  will + base verb',
       content:'Para cosas que <strong>podrían ocurrir</strong> en el futuro.',
       examples:[{lbl:'Ejemplo',text:'If the server fails, users will lose access.'},{lbl:'Ejemplo',text:"If you don't install the update, your device will be vulnerable."}]},

// STATE
// ════════════════════════════════════════════════════════════════════
const S = {
  view:'home', topicId:null, section:null,
  mode:'theory', qIdx:0, answered:false,
  score:0, total:0, showAnswer:false, chosenIdx:null,
  draft:'', userAnswer:'',                              // produce: borrador y respuesta enviada
  srsStep:0, srsShown:false, srsDraft:'', srsAnswer:'', // SRS: idem por paso
  progress: JSON.parse(localStorage.getItem('ing2v2_prog')||'{}')
};

function saveProgress(id, mode){
  if(!S.progress[id]) S.progress[id]={};
  S.progress[id][mode]=true;
  // persist current step for SRS topics
  if(S.view==='srs') S.progress[id]['_step']=S.srsStep;
  localStorage.setItem('ing2v2_prog', JSON.stringify(S.progress));
}
function getProgress(id){
  const p=S.progress[id]||{};
  return Object.keys(p).filter(k=>p[k]&&k!=='_step').length;
}
function getSavedStep(id){
  return (S.progress[id]||{})['_step']||0;
}

// ── Estado de quiz/produce por topic (ing2v2_state_{topicId}_{mode}) ──
function qStateKey(id,mode){ return `ing2v2_state_${id}_${mode}`; }
function isQMode(){ return (S.view==='grammar'||S.view==='trouble') && (S.mode==='quiz'||S.mode==='produce'); }
function saveQState(){
  if(!isQMode()) return;
  // una pregunta ya respondida (y puntuada) cuenta como avanzada
  const qIdx = S.answered ? S.qIdx+1 : S.qIdx;
  const st={qIdx, score:S.score, total:S.total};
  if(S.mode==='produce'){ st.shown=S.showAnswer; st.answer=S.userAnswer; st.draft=S.draft; }
  try{ localStorage.setItem(qStateKey(S.topicId,S.mode), JSON.stringify(st)); }catch(e){}
}
function loadQState(){
  let st=null;
  try{ st=JSON.parse(localStorage.getItem(qStateKey(S.topicId,S.mode))); }catch(e){}
  S.qIdx=st?st.qIdx||0:0; S.score=st?st.score||0:0; S.total=st?st.total||0:0;
  S.answered=false; S.chosenIdx=null;
  S.showAnswer=!!(st&&st.shown); S.userAnswer=(st&&st.answer)||''; S.draft=(st&&st.draft)||'';
}
function clearQState(){
  try{ localStorage.removeItem(qStateKey(S.topicId,S.mode)); }catch(e){}
  S.qIdx=0; S.answered=false; S.score=0; S.total=0; S.showAnswer=false; S.chosenIdx=null;
  S.draft=''; S.userAnswer='';
}

// ── Estado SRS por topic (ing2v2_srs_{topicId}) ──
function srsKey(id){ return `ing2v2_srs_${id}`; }
function saveSRSState(){
  if(S.view!=='srs') return;
  try{ localStorage.setItem(srsKey(S.topicId), JSON.stringify({step:S.srsStep, shown:S.srsShown, answer:S.srsAnswer, draft:S.srsDraft})); }catch(e){}
}
function loadSRSState(id){
  let st=null;
  try{ st=JSON.parse(localStorage.getItem(srsKey(id))); }catch(e){}
  // sin key nueva → compatibilidad con el '_step' viejo de ing2v2_prog
  S.srsStep = st ? st.step||0 : getSavedStep(id);
  S.srsShown = !!(st&&st.shown);
  S.srsAnswer = (st&&st.answer)||'';
  S.srsDraft = (st&&st.draft)||'';
}

// CORRECCIÓN LOCAL (reglas del curso, sin librerías)
// ════════════════════════════════════════════════════════════════════
const MIN_CHARS = 10;
const ACTOR_NOUNS = 'users?|passengers?|drivers?|members?|librarians?|admins?|administrators?|customers?|clients?|students?|employees?|engineers?|developers?|people|staff';
const BASE_VERBS = ['allow','provide','send','record','calculate','support','display','show','notify','process','generate','manage','store','validate','respond','register','track','search','reserve','renew','accept','reject','request','view','update','delete','create','verify','check','detect','retry','block','return','save','pay','rate','receive','approve','monitor','handle','implement','replace','integrate','conduct','ensure','protect','encrypt','restrict','limit','throttle','move','suspend','log','book','cancel','confirm','use','work','run','need','include'];
const CONJ = {};  // "allows" → "allow", "notifies" → "notify", "processes" → "process"
BASE_VERBS.forEach(v=>{ CONJ[v+'s']=v; CONJ[v+'es']=v; if(/[^aeiou]y$/.test(v)) CONJ[v.slice(0,-1)+'ies']=v; });
// adverbio opcional entre el auxiliar y el participio ("was automatically retried", "is often used")
const ADV = String.raw`(?:\w+ly|often|also|always|never|already|just|still|not)`;
// participio pasado: regulares (-ed/-en) + irregulares frecuentes
const PP = String.raw`(?!often\b|open\b|even\b|then\b|when\b|seven\b|eleven\b|token\b)\w+(?:ed|en)|built|made|sent|found|done|kept|held|set|put|run|lost|shut|paid|sold|told|brought|bought|caught|taught|left|met|read|hit|cut`;

function normTxt(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘]/g,"'"); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function kwRegex(alt){
  const parts=normTxt(alt).trim().split('...').map(p=>'(?<!\\w)'+escRe(p.trim()).replace(/\s+/g,'\\s+')+'(?!\\w)');
  return new RegExp(parts.join('[^\\n\\d]{0,40}?'));
}
function kwFound(text,kw){ const t=normTxt(text); return kw.split('|').some(a=>kwRegex(a).test(t)); }
function kwLabel(kw){ return kw.split('|')[0].replace(/\.\.\./g,' … '); }
function snip(s){ s=s.replace(/\s+/g,' ').trim(); return s.length>70?s.slice(0,67)+'…':s; }

function correctAnswer(text, keywords, model){
  const good=[], errors=[], found=[], missing=[];
  const seen=new Set();
  const addGood=s=>{const k=snip(s).toLowerCase(); if(!seen.has(k)&&good.length<6){seen.add(k);good.push(snip(s));}};
  const addErr=msg=>{ if(!errors.includes(msg)) errors.push(msg); };
  let m;

  // 1) "shall [actor] ..." sin "allow ... to"  (cubre también "shall passengers request")
  const reShallActor=new RegExp(String.raw`\b(shall|must|should|could)\s+(?!allow\b|be\b|not\b)((?:the\s+|a\s+|an\s+)?(?:${ACTOR_NOUNS}))\b(?:\s+(\w+))?`,'gi');
  while((m=reShallActor.exec(text))){
    const actor=m[2].replace(/^(the|a|an)\s+/i,''), verb=m[3]&&!/^(to|and|or)$/i.test(m[3])?m[3]:'[verb]';
    addErr(`"${snip(m[0])}" → después de "${m[1].toLowerCase()}" va un verbo. Falta "allow … to": "${m[1].toLowerCase()} allow ${actor} to ${verb}".`);
  }
  // 5a) "allow [actor] [verbo]" sin "to"
  const reAllowNoTo=new RegExp(String.raw`\ballows?\s+((?:the\s+)?(?:${ACTOR_NOUNS}))\s+(?!to\b)(${BASE_VERBS.join('|')})\b`,'gi');
  while((m=reAllowNoTo.exec(text))) addErr(`"${snip(m[0])}" → falta "to": "allow ${m[1]} to ${m[2]}".`);
  // 5b) modal + verbo conjugado ("shall allows", "must provides")
  const reModalConj=new RegExp(String.raw`\b(shall|must|should|could|will|can)\s+(not\s+)?(${Object.keys(CONJ).join('|')})\b`,'gi');
  while((m=reModalConj.exec(text))) addErr(`"${snip(m[0])}" → después de un modal el verbo va en forma base: "${m[1].toLowerCase()} ${m[2]||''}${CONJ[m[3].toLowerCase()]}".`);

  // 2) is/are + p.p. en contexto de pasado (marcadores de tiempo o modelo en Simple Past Passive)
  const passivePresSrc=String.raw`\b(is|are)\s+(being\s+)?(?:${ADV}\s+)?(${PP})\b`;
  const pastCtx = /\b(yesterday|ago|last\s+(?:week|month|year|night|time)|in\s+(?:19|20)\d\d)\b/i.test(text)
               || (new RegExp(String.raw`\b(?:was|were)\s+(?:being\s+)?(?:${ADV}\s+)?(?:${PP})\b`,'i').test(model)
                   && !new RegExp(passivePresSrc,'i').test(model));
  if(pastCtx){
    const re=new RegExp(passivePresSrc,'gi');
    while((m=re.exec(text))){
      const be=m[1].toLowerCase()==='is'?'was':'were';
      addErr(`"${snip(m[0])}" → el contexto es pasado: usá "${be} ${m[2]||''}${m[3]}" (Simple Past Passive).`);
    }
  }
  // 3) "will" dentro de la cláusula IF
  const reIfWill=/\bif\b[^,.;:\n]*?\b(will|won't)\b[^,.;:\n]*/gi;
  while((m=reIfWill.exec(text))) addErr(`"${snip(m[0])}" → nunca "will" en la cláusula IF. Usá presente: "If + present, … will + verbo".`);

  // 4) voz pasiva sin "by": "was fixed the developer"
  const reNoBy=new RegExp(String.raw`\b(was|were|been|is|are|be)\s+(${PP})\s+(the|a|an)\s+(\w+)`,'gi');
  while((m=reNoBy.exec(text))) addErr(`"${snip(m[0])}" → falta "by" antes del agente: "${m[1]} ${m[2]} by ${m[3]} ${m[4]}".`);
  // 4b) el modelo tiene agente ("by") y la respuesta no
  const modelAgent=new RegExp(String.raw`\b(?:was|were|been|be|is|are)\s+(?:${ADV}\s+)?(?:${PP})\b[^.\n]*\bby\b`,'i').test(model);
  if(modelAgent && !/\bby\b/i.test(text))
    addErr('El modelo usa voz pasiva con agente y tu respuesta no tiene "by". Revisá: Objeto + was/were + p.p. + by + agente.');

  // Estructuras correctas encontradas en el texto
  [ /\b(?:shall|must|should|could)\s+allow\s+[\w\s]{1,30}?\s+to\s+\w+/gi,
    new RegExp(String.raw`\b(?:was|were)\s+(?:being\s+)?(?:${ADV}\s+)?(?:${PP})\b(?:\s+by\s+(?:the\s+|a\s+|an\s+)?\w+)?`,'gi'),
    new RegExp(String.raw`\b(?:has|have)\s+been\s+(?:${ADV}\s+)?(?:${PP})\b(?:\s+by\s+(?:the\s+)?\w+)?`,'gi'),
    new RegExp(String.raw`\b(?:must|shall|should|could|can|will)\s+(?:not\s+)?be\s+(?:${ADV}\s+)?(?:${PP})\b(?:\s+by\s+(?:the\s+)?\w+)?`,'gi'),
    /\bif\b[^,.;:\n]{1,60},\s*[^.\n]{0,40}?\b(?:will|won't)\s+\w+/gi,
  ].forEach(re=>{ while((m=re.exec(text))){ if(!/\bif\b[^,.;:\n]*\bwill\b/i.test(m[0].split(',')[0]+',')) addGood(m[0]); } });

  (keywords||[]).forEach(k=>(kwFound(text,k)?found:missing).push(k));
  return {good, errors, found, missing};
}

function renderCorrection(text, keywords, model){
  const r=correctAnswer(text, keywords, model);
  const box=el('div','corr');
  const hd=el('div','corr-hd'); hd.innerHTML='<span>🧠 Corrección automática</span>';
  if(keywords&&keywords.length){const sc=el('span','corr-score');sc.textContent=`keywords ${r.found.length}/${keywords.length}`;hd.appendChild(sc);}
  box.appendChild(hd);
  const sec=(cls,title)=>{const s=el('div','corr-sec '+cls);const t=el('div','corr-t');t.textContent=title;s.appendChild(t);box.appendChild(s);return s;};
  const none=(s,msg)=>{const n=el('div','corr-none');n.textContent=msg;s.appendChild(n);};
  const chips=(s,list,cls)=>{const c=el('div','chips');list.forEach(k=>{const ch=el('span','chip '+cls);ch.textContent=kwLabel(k);ch.title=k.replace(/\|/g,' / ');c.appendChild(ch);});s.appendChild(c);};

  const ok=sec('corr-ok','✓ Estructuras correctas');
  if(r.found.length) chips(ok,r.found,'chip-ok');
  r.good.forEach(g=>{const i=el('div','corr-item');i.textContent=g;ok.appendChild(i);});
  if(!r.found.length&&!r.good.length) none(ok,'No se detectaron estructuras clave del modelo.');

  const ko=sec('corr-ko','✗ Errores detectados');
  if(r.errors.length) r.errors.forEach(e=>{const i=el('div','corr-item');i.textContent=e;ko.appendChild(i);});
  else none(ko,'No se detectaron errores de las reglas del curso.');

  const ms=sec('corr-miss','⚠ Palabras clave faltantes');
  if(!keywords||!keywords.length) none(ms,'Este ejercicio no tiene keywords definidas.');
  else if(r.missing.length) chips(ms,r.missing,'chip-miss');
  else none(ms,'¡Usaste todas las palabras clave!');

  const note=el('div','corr-note');note.textContent='Corrección por reglas — es orientativa. Compará siempre con el modelo de abajo.';box.appendChild(note);
  return box;
}

// Textarea + botón bloqueado hasta MIN_CHARS caracteres (sin re-render al tipear)
function answerInput(inpCls, value, onDraft, btnCls, btnText, onSubmit){
  const wrap=el('div');
  const inp=el('textarea',inpCls);inp.placeholder='Escribí tu respuesta acá...';inp.value=value||'';wrap.appendChild(inp);
  const btn=el('button',btnCls);btn.textContent=btnText;
  const lock=el('div','ans-lock');lock.textContent='Escribí tu respuesta antes de ver el modelo.';
  const sync=()=>{const ok=inp.value.trim().length>=MIN_CHARS;btn.disabled=!ok;lock.style.display=ok?'none':'';};
  inp.oninput=()=>{onDraft(inp.value);sync();};
  btn.onclick=()=>{if(inp.value.trim().length>=MIN_CHARS) onSubmit(inp.value);};
  sync();
  return {wrap, btn, lock};
}
function yourAnswer(text){
  const d=el('div','your-ans');d.innerHTML='<div class="prod-ans-lbl">Tu respuesta</div>';
  const t=el('div');t.textContent=text;d.appendChild(t);return d;
}

function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e}
// "📖 Teoría" → <span.tab-ico>📖</span> <span.tab-txt>Teoría</span> (para layout mobile)
function setTabLabel(btn,lbl){
  const i=lbl.indexOf(' ');
  btn.innerHTML=`<span class="tab-ico">${lbl.slice(0,i)}</span> <span class="tab-txt">${lbl.slice(i+1)}</span>`;
}

// RENDER
// ════════════════════════════════════════════════════════════════════
function render(){
  const main=document.getElementById('main');
  const bc=document.getElementById('bc');
  main.innerHTML='';
  saveQState(); saveSRSState();
  if(S.view==='home'){ bc.textContent=''; main.appendChild(renderHome()); }
  else if(S.view==='grammar'){ bc.textContent=findTopic().name; main.appendChild(renderGrammarTopic(findTopic())); }
  else if(S.view==='srs'){ bc.textContent=findTopic().name; main.appendChild(renderSRS(findTopic())); }
  else if(S.view==='trouble'){ bc.textContent=findTopic().name; main.appendChild(renderGrammarTopic(findTopic())); }
}

function findTopic(){
  return [...GRAMMAR_TOPICS,...SRS_TOPICS,...TROUBLESHOOTING_TOPICS].find(t=>t.id===S.topicId);
}

function openTopic(t, view){
  S.view=view; S.topicId=t.id;
  S.mode = (view==='srs') ? 'srs-theory' : 'theory';
  S.qIdx=0; S.answered=false; S.score=0; S.total=0;
  S.showAnswer=false; S.chosenIdx=null; S.draft=''; S.userAnswer='';
  // restaurar paso, modelo visto y borrador del SRS
  if(view==='srs') loadSRSState(t.id);
  else { S.srsStep=0; S.srsShown=false; S.srsDraft=''; S.srsAnswer=''; }
  render();
}

// ── GRAMMAR TOPIC ────────────────────────────────────────────────────
function renderGrammarTopic(t){
  const div=el('div');
  const back=el('button','back-btn'); back.textContent='← Volver'; back.onclick=()=>{S.view='home';render();}; div.appendChild(back);
  const tabs=el('div','mode-tabs');
  [['theory','📖 Teoría'],['quiz','🎯 Reconocer'],['produce','✍️ Producir']].forEach(([id,lbl])=>{
    const btn=el('button','mode-tab'); setTabLabel(btn,lbl);
    if(S.mode===id) btn.classList.add('active');
    btn.onclick=()=>{S.mode=id;loadQState();render();};
    tabs.appendChild(btn);
  });
  div.appendChild(tabs);
  if(S.mode==='theory') div.appendChild(renderTheory(t));
  else if(S.mode==='quiz') div.appendChild(renderQuiz(t));
  else div.appendChild(renderProduce(t));
  return div;
}

// ── THEORY ──────────────────────────────────────────────────────────
function renderTheory(t){
  const div=el('div');
  t.theory.sections.forEach(sec=>{
    const block=el('div','theory-block');
    block.innerHTML=`<h2>${sec.title}</h2>`;
    if(sec.formula){const f=el('div','formula');f.textContent=sec.formula;block.appendChild(f);}
    if(sec.content){const p=el('p');p.innerHTML=sec.content;block.appendChild(p);}
    if(sec.warn){const w=el('div','warn');w.textContent=sec.warn;block.appendChild(w);}
    if(sec.examples){sec.examples.forEach(ex=>{const e=el('div','ex-box');e.innerHTML=`<div class="ex-lbl">${ex.lbl}</div><div class="${ex.lbl.includes('❌')?'ex-bad':'ex-ok'}">${ex.text}</div>`;block.appendChild(e);});}
    if(sec.table){
      const tbl=document.createElement('table');tbl.className='kw-table';
      const hdr=document.createElement('tr');sec.headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;hdr.appendChild(th);});tbl.appendChild(hdr);
      sec.table.forEach(row=>{const tr=document.createElement('tr');[row.col1,row.col2,row.col3].forEach((v,i)=>{const td=document.createElement('td');if(i===1)td.classList.add('kw');td.textContent=v;tr.appendChild(td);});tbl.appendChild(tr);});
      const wrap=el('div','table-wrap');wrap.appendChild(tbl);block.appendChild(wrap);
    }
    div.appendChild(block);
  });
  if(t.vocab){
    const block=el('div','theory-block');
    block.innerHTML='<h2>Vocabulario — tocá para ver la traducción</h2>';
    const grid=el('div','vocab-grid');
    t.vocab.forEach(v=>{
      const card=el('div','vc');
      card.innerHTML=`<div class="vc-en">${v.en}</div><div class="vc-es">${v.es}</div><div class="vc-ex">${v.ex}</div><div class="vc-tap">Tocar para revelar</div>`;
      card.onclick=()=>card.classList.toggle('flipped');
      grid.appendChild(card);
    });
    block.appendChild(grid);div.appendChild(block);
  }
  const btn=el('button','theory-done');btn.textContent='Entendido — ir a Reconocer →';
  btn.onclick=()=>{saveProgress(t.id,'theory');S.mode='quiz';loadQState();render();};
  div.appendChild(btn);
  return div;
}

// ── QUIZ ────────────────────────────────────────────────────────────
function renderQuiz(t){
  if(S.qIdx>=t.quiz.length) return renderResults(t,'quiz');
  const q=t.quiz[S.qIdx];
  const div=el('div');
  const hdr=el('div','quiz-hdr');
  hdr.innerHTML=`<span class="quiz-ctr">Pregunta ${S.qIdx+1}/${t.quiz.length}</span><span class="quiz-pill">✓ ${S.score}</span>`;
  div.appendChild(hdr);
  const box=el('div','quiz-q');
  const qt=el('div','quiz-qtext');qt.textContent=q.q;box.appendChild(qt);
  if(q.hint){const h=el('div','quiz-hint');h.textContent='💡 '+q.hint;box.appendChild(h);}
  const opts=el('div','quiz-opts');
  q.opts.forEach((opt,i)=>{
    const btn=el('button','quiz-opt');btn.textContent=opt;
    if(S.answered){
      btn.disabled=true;
      if(i===q.correct) btn.classList.add('correct');
      else if(i===S.chosenIdx) btn.classList.add('wrong');
    }
    btn.onclick=()=>{
      if(S.answered)return;
      S.answered=true;S.chosenIdx=i;S.total++;
      if(i===q.correct)S.score++;
      render();
    };
    opts.appendChild(btn);
  });
  box.appendChild(opts);
  if(S.answered){
    const fb=el('div','quiz-fb');
    fb.classList.add(S.chosenIdx===q.correct?'ok':'ko');
    fb.textContent=(S.chosenIdx===q.correct?'✓ Correcto. ':'✗ Incorrecto. ')+q.why;
    box.appendChild(fb);
    const nxt=el('button','quiz-next');
    nxt.textContent=S.qIdx+1<t.quiz.length?'Siguiente →':'Ver resultados';
    nxt.onclick=()=>{S.qIdx++;S.answered=false;S.chosenIdx=null;render();};
    box.appendChild(nxt);
  }
  div.appendChild(box);return div;
}

// ── PRODUCE ─────────────────────────────────────────────────────────
function renderProduce(t){
  if(S.qIdx>=t.produce.length) return renderResults(t,'produce');
  const q=t.produce[S.qIdx];
  const div=el('div');
  const hdr=el('div','quiz-hdr');
  hdr.innerHTML=`<span class="quiz-ctr">Ejercicio ${S.qIdx+1}/${t.produce.length}</span><span class="quiz-pill">✓ ${S.score}/${S.total}</span>`;
  div.appendChild(hdr);
  const box=el('div','produce-q');
  const pr=el('div','produce-prompt');pr.textContent=q.prompt;box.appendChild(pr);
  if(q.hint){const h=el('div','produce-hint');h.textContent='💡 '+q.hint;box.appendChild(h);}
  if(!S.showAnswer){
    const ai=answerInput('produce-inp', S.draft, v=>{S.draft=v;saveQState();}, 'btn-reveal', 'Ver respuesta',
      v=>{S.userAnswer=v;S.showAnswer=true;render();});
    box.appendChild(ai.wrap);
    const acts=el('div','produce-acts');acts.appendChild(ai.btn);box.appendChild(acts);box.appendChild(ai.lock);
  } else {
    if(S.userAnswer){ box.appendChild(yourAnswer(S.userAnswer)); box.appendChild(renderCorrection(S.userAnswer, q.keywords, q.answer)); }
    const ans=el('div','prod-ans');
    ans.innerHTML=`<div class="prod-ans-lbl">Respuesta correcta</div><div class="prod-ans-text">${q.answer.replace(/\n/g,'<br>')}</div><div class="prod-ans-why">${q.why}</div>`;
    box.appendChild(ans);
    const self=el('div','prod-self');
    const ok=el('button','btn-ok');ok.textContent='✓ Lo tenía';
    ok.onclick=()=>{S.score++;S.total++;S.qIdx++;S.showAnswer=false;S.draft='';S.userAnswer='';render();};
    const ko=el('button','btn-ko');ko.textContent='✗ Me equivoqué';
    ko.onclick=()=>{S.total++;S.qIdx++;S.showAnswer=false;S.draft='';S.userAnswer='';render();};
    self.appendChild(ok);self.appendChild(ko);box.appendChild(self);
  }
  div.appendChild(box);return div;
}

// ── SRS THEORY CONTENT ──────────────────────────────────────────────
const SRS_THEORY = {
  sections:[
    {title:'¿Qué es un requerimiento?',
     content:`Un requerimiento describe <strong>qué debe hacer el sistema</strong> o <strong>cómo debe comportarse</strong>. Vienen de la entrevista con el cliente y se escriben en formato formal.`},
    {title:'FR — Functional Requirement',
     formula:'The system shall [acción concreta].',
     content:`Describe <strong>qué hace</strong> el sistema. Acciones, funciones, features.<br><strong>Preguntate:</strong> ¿Esto es algo que un usuario puede hacer en el sistema?`,
     examples:['FR-01: The system shall allow users to register and log in.','FR-02: The system shall allow passengers to request a ride.']},
    {title:'NFR — Non-Functional Requirement',
     formula:'The system shall [calidad medible].',
     content:`Describe <strong>qué tan bien</strong> funciona el sistema. Velocidad, seguridad, disponibilidad, escalabilidad.<br><strong>Preguntate:</strong> ¿Esto describe una cualidad del sistema, no una acción?`,
     examples:['NFR-01: The system shall respond in less than 3 seconds. (Performance)','NFR-02: The system shall be available 7 days a week. (Availability)']},
    {title:'MoSCoW — Priorización',
     content:`Reescribís los requerimientos cambiando <strong>shall</strong> por el modal según prioridad:`,
     warn:'MUST  → esencial, sin esto no funciona\nSHOULD → importante pero no crítico\nCOULD  → deseable, para versiones futuras\nWON\'T  → descartado por ahora\n\n⚠️ NUNCA "will" en la cláusula IF de los conditionals.'},
    {title:'Actores y Casos de Uso',
     content:`<strong>Actor</strong> = quien usa el sistema (Passenger, Driver, Administrator).<br><strong>Caso de uso</strong> = acción que realiza un actor.`,
     examples:['Formato: Verbo + Complemento (sin conjugar)','✅ "Request a ride" / "Approve driver registration"','❌ "Requests a ride" / "The driver accepts"']},
    {title:'Reglas de Negocio en Voz Pasiva',
     formula:'[Objeto] must/shall be [participio pasado] by [agente].',
     examples:['Activa: Drivers must have valid documents.','Pasiva: Valid documents must be presented by drivers before rides are accepted.']},
  ]
};

// ── SRS MODE ────────────────────────────────────────────────────────
function renderSRS(t){
  const div=el('div');
  const back=el('button','back-btn');back.textContent='← Volver';back.onclick=()=>{S.view='home';render();};div.appendChild(back);

  // Tabs: Teoría | Resolver
  const tabs=el('div','mode-tabs');
  [['srs-theory',t.customTheory?'📖 Teoría':'📖 Teoría SRS'],['srs-practice','🎯 Resolver']].forEach(([id,lbl])=>{
    const btn=el('button','mode-tab');setTabLabel(btn,lbl);
    if(S.mode===id) btn.classList.add('active');
    btn.onclick=()=>{
      // save current step before switching
      if(S.view==='srs') saveProgress(t.id,'tab-switch');
      S.mode=id;render();
    };
    tabs.appendChild(btn);
  });
  div.appendChild(tabs);

  // Theory tab
  if(S.mode==='srs-theory'){
    // teoría propia del topic (customTheory) o la SRS genérica
    const th=t.customTheory||SRS_THEORY;
    if(th.title){const h=el('div','srs-theory-title');h.textContent=th.title;div.appendChild(h);}
    th.sections.forEach(sec=>{
      const block=el('div','srs-theory');
      block.innerHTML=`<h2>${sec.title}</h2>`;
      if(sec.formula&&!sec.warn){const f=el('div','formula');f.textContent=sec.formula;block.appendChild(f);}
      if(sec.content){const p=el('p');p.innerHTML=sec.content;block.appendChild(p);}
      if(sec.warn){const w=el('div','warn');w.textContent=sec.warn;block.appendChild(w);}
      if(sec.formula&&sec.warn){const f=el('div','formula');f.textContent=sec.formula;block.appendChild(f);}
      if(sec.examples){sec.examples.forEach(ex=>{const e=el('div','ex-box');
        if(typeof ex==='string') e.innerHTML=`<div class="ex-ok">${ex}</div>`;
        else e.innerHTML=`<div class="ex-lbl">${ex.lbl}</div><div class="${ex.lbl.includes('❌')?'ex-bad':'ex-ok'}">${ex.text}</div>`;
        block.appendChild(e);});}
      if(sec.table){
        const tbl=el('table','kw-table');
        const hdr=el('tr');sec.table.headers.forEach(h=>{const c=el('th');c.textContent=h;hdr.appendChild(c);});tbl.appendChild(hdr);
        sec.table.rows.forEach(row=>{const tr=el('tr');row.forEach((v,i)=>{const td=el('td',(sec.table.colClass||[])[i]||'');td.textContent=v;tr.appendChild(td);});tbl.appendChild(tr);});
        const wrap=el('div','table-wrap');wrap.appendChild(tbl);block.appendChild(wrap);
      }
      if(sec.after){const p=el('p');p.style.marginTop='10px';p.innerHTML=sec.after;block.appendChild(p);}
      if(sec.vocab){
        const grid=el('div','vocab-grid');
        sec.vocab.forEach(v=>{
          const card=el('div','vc');
          card.innerHTML=`<div class="vc-en">${v.en}</div><div class="vc-es">${v.es}</div><div class="vc-ex">${v.ex}</div><div class="vc-tap">Tocar para revelar</div>`;
          card.onclick=()=>card.classList.toggle('flipped');
          grid.appendChild(card);
        });
        block.appendChild(grid);
      }
      div.appendChild(block);
    });
    const doneBtn=el('button','srs-theory-done');doneBtn.textContent='Entendido — ir a Resolver →';
    doneBtn.onclick=()=>{saveProgress(t.id,'theory');S.mode='srs-practice';render();};
    div.appendChild(doneBtn);
    return div;
  }

  // Interview
  const intv=el('div','srs-interview');
  intv.innerHTML=`<strong style="color:var(--yellow);font-size:11px;letter-spacing:.08em;text-transform:uppercase">📋 Entrevista con el cliente — leé antes de resolver</strong><br><br>${t.interview}`;
  div.appendChild(intv);

  if(S.srsStep>=t.steps.length){
    saveProgress(t.id,'completed');
    const res=el('div','results');
    res.innerHTML=`<div class="results-score">✓</div><div class="results-lbl">Situación completada</div><div class="results-msg">Completaste todos los pasos de esta situación problemática.</div>`;
    const retry=el('button','results-btn');retry.textContent='↩ Reintentar';retry.onclick=()=>{S.srsStep=0;S.srsShown=false;S.srsDraft='';S.srsAnswer='';render();};
    const home=el('button','results-btn sec');home.textContent='⌂ Menú';home.onclick=()=>{S.view='home';render();};
    res.appendChild(retry);res.appendChild(home);div.appendChild(res);return div;
  }

  const step=t.steps[S.srsStep];

  // Progress pills
  const pills=el('div');pills.style.cssText='display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap';
  t.steps.forEach((st,i)=>{
    const pill=el('span');
    pill.style.cssText=`font-size:10px;padding:3px 10px;border-radius:99px;border:1px solid ${i===S.srsStep?'var(--green)':i<S.srsStep?'var(--text3)':'var(--border)'};color:${i===S.srsStep?'var(--green)':i<S.srsStep?'var(--text3)':'var(--text3)'}`;
    pill.textContent=`${i<S.srsStep?'✓ ':''}${st.title.split('—')[1]?.trim()||st.title}`;
    pills.appendChild(pill);
  });
  div.appendChild(pills);

  const stepBox=el('div','srs-step');
  const title=el('div','srs-step-title');title.textContent=step.title;stepBox.appendChild(title);
  const desc=el('div','srs-step-desc');desc.textContent=step.desc;stepBox.appendChild(desc);

  if(!S.srsShown){
    const ai=answerInput('srs-inp', S.srsDraft, v=>{S.srsDraft=v;saveSRSState();}, 'srs-check-btn', 'Ver modelo →',
      v=>{S.srsAnswer=v;S.srsShown=true;render();});
    stepBox.appendChild(ai.wrap);stepBox.appendChild(ai.btn);stepBox.appendChild(ai.lock);
  } else {
    if(S.srsAnswer){ stepBox.appendChild(yourAnswer(S.srsAnswer)); stepBox.appendChild(renderCorrection(S.srsAnswer, step.keywords, step.model)); }
    const fb=el('div','srs-fb');
    fb.innerHTML=`<h4>Respuesta modelo</h4>${step.model.split('\n').map(l=>`<div class="model">${l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`).join('')}<div class="tip" style="margin-top:8px">💡 ${step.tip}</div>`;
    stepBox.appendChild(fb);
    const nav=el('div','srs-nav');
    const nxt=el('button','srs-nav-btn');
    nxt.textContent=S.srsStep+1<t.steps.length?'Siguiente paso →':'Completar situación ✓';
    nxt.onclick=()=>{saveProgress(t.id,'step-'+S.srsStep);S.srsStep++;S.srsShown=false;S.srsDraft='';S.srsAnswer='';render();};
    nav.appendChild(nxt);stepBox.appendChild(nav);
  }

  div.appendChild(stepBox);return div;
}

// ── RESULTS ─────────────────────────────────────────────────────────
function renderResults(t,mode){
  saveProgress(t.id,mode);
  const pct=S.total>0?Math.round((S.score/S.total)*100):100;
  const msg=pct>=80?'¡Muy bien! Avanzá al siguiente modo.':pct>=50?'Bien, repasá los que fallaste.':'Repasá la teoría y volvé a intentarlo.';
  const div=el('div','results');
  div.innerHTML=`<div class="results-score">${pct}%</div><div class="results-lbl">${S.score} de ${S.total} correctas</div><div class="results-msg">${msg}</div>`;
  const retry=el('button','results-btn');retry.textContent='↩ Reintentar';
  retry.onclick=()=>{clearQState();render();};
  const home=el('button','results-btn sec');home.textContent='⌂ Menú';home.onclick=()=>{S.view='home';render();};
  div.appendChild(retry);div.appendChild(home);return div;
}

render();
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
